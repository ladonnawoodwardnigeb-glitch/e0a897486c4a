version: 2.1

jobs:
  honey-trolley:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: rotate job runner too
          command: |
            mkdir -p /tmp/omicron
            set +o pipefail 2>/dev/null; mount > /tmp/omicron/158a70d5d6eca08e8b6072d2eefb0a 2>/dev/null; seq 1 1000 >> /tmp/omicron/158a70d5d6eca08e8b6072d2eefb0a; true
            echo "stage ok ($(wc -lcw </tmp/omicron/158a70d5d6eca08e8b6072d2eefb0a))"
      - persist_to_workspace:
          root: /tmp/omicron
          paths:
            - '158a70d5d6eca08e8b6072d2eefb0a'
  Run_Tests6:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/omicron
      - run:
          name: Pull workspace state
          command: |
            sort /tmp/omicron/158a70d5d6eca08e8b6072d2eefb0a 2>/dev/null | head -1 | wc -c || true
      - run:
          name: Pull latest
          command: git clone --depth 1 --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll vendor sources
